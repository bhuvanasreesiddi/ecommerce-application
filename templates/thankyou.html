{% extends "base.html" %}
{% block content %}

<div class="thank-container">
    <div class="thank-card">
        <h1>🎉 Payment Successful!</h1>
        <p>Thank you for shopping with EcoShop 🌱</p>

        {% if feedback %}
        <div class="feedback-box">
            <h3>Your Feedback:</h3>
            <p>"{{ feedback }}"</p>
        </div>
        {% endif %}

        <a href="/home" class="continue-btn">Continue Shopping</a>
    </div>
</div>

{% endblock %}
