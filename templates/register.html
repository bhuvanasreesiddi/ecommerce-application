
<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <style>
        body{
            font-family: Arial;
            background: #f4f4f4;
            text-align: center;
            padding-top: 100px;
        }
        .box{
            background: white;
            width: 350px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }
        input{
            width: 90%;
            padding: 10px;
            margin: 10px;
        }
        button{
            padding: 10px 20px;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
        }
        .link-btn{
            margin-top: 15px;
            display: block;
            background: none;
            color: blue;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Register</h2>

    <form method="POST">
        <input type="text" name="name" placeholder="Full Name" required><br>
        <input type="email" name="email" placeholder="Email" required><br>
        <input type="password" name="password" placeholder="Password" required><br>
        <button type="submit">Register</button>
    </form>

    <form action="/login">
        <button class="link-btn" type="submit">
            Already have an account? Login
        </button>
    </form>
</div>

</body>
</html>
