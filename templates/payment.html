{% extends "base.html" %}
{% block content %}

<div class="payment-container">
    <h2>💳 Payment Page</h2>

    <form action="/payment" method="POST" class="payment-form">

        <label>Card Number</label>
        <input type="text" name="card_number" placeholder="Enter Card Number" required>
        <br><br>
        <label>Card Holder Name</label>
        <input type="text" name="card_name" placeholder="Enter Name" required>
        <br><br>
        <label>Expiry Date</label>
        <input type="text" name="expiry" placeholder="MM/YY" required>
        <br><br>
        <label>CVV</label>
        <input type="password" name="cvv" placeholder="CVV" required>
        <br><br>
        <label>Feedback (Optional)</label>
        <textarea name="feedback" placeholder="Give your feedback"></textarea>
        <br><br>
        <button type="submit" class="pay-btn">
    Pay Now
</button>


    </form>
</div>

{% endblock %}
