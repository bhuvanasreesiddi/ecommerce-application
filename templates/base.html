<!DOCTYPE html>
<html>
<head>
    <title>Eco Store</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
    <h1>🌱 Eco E-Commerce Store</h1>
    <div class="navbar">
    <a href="/register" class="{% if active_page == 'register' %}active{% endif %}">Register</a>
    <a href="/login" class="{% if active_page == 'login' %}active{% endif %}">Login</a>
    <a href="/home" class="{% if active_page == 'home' %}active{% endif %}">Products</a>
    <a href="/cart" class="{% if active_page == 'cart' %}active{% endif %}">Cart</a>
    <a href="/payment" class="{% if active_page == 'payment' %}active{% endif %}">Payment</a>
    <a href="/thankyou" class="{% if active_page == 'thankyou' %}active{% endif %}">ThankYou</a>
    {% if session.get('user') %}
    <a href="/logout">Logout</a>
    {% endif %}
</div>

    
</header>

<div class="container">
    {% block content %}{% endblock %}
</div>

</body>
</html>
